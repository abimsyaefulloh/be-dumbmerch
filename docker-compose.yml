version: '3.8'
services:
  backend:
    build: .
    container_name: be-dumbmerch-backend
    ports:
      - "5000:5000"
    env_file:
      - .env  # Jika .env ada di host, ini akan di-load
    environment:  # Tambahan: Set PORT explicitly
      PORT: "5000"  # Pastikan server bind ke port 5000
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:14-alpine
    container_name: db
    environment:
      POSTGRES_USER: abim
      POSTGRES_PASSWORD: abim123
      POSTGRES_DB: dumbmerch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abim -d dumbmerch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
